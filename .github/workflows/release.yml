name: Release

# Tag-driven publishing. A maintainer runs the release ritual locally:
#   1. pnpm changeset version   # consume .changeset/*.md → bump package.json + CHANGELOG.md
#   2. git commit -am "chore: release vX.Y.Z"
#   3. git tag vX.Y.Z && git push --follow-tags
# Pushing the tag fires this workflow, which publishes to npm and cuts a GitHub
# Release. No "Version Packages" PR is opened, so this needs no Actions
# PR-create permission (the path that was blocked on #26/#27 — see POS-19).
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm trusted publishing (OIDC) + provenance

concurrency:
  group: release-${{ github.ref }}

# Skip git hooks (husky) during the CI install.
env:
  HUSKY: '0'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      # Checks out the tagged commit, whose package.json/CHANGELOG.md already
      # carry the bumped version from `pnpm changeset version`. This job uploads
      # no artifacts, so artipacked does not apply.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0 # zizmor: ignore[artipacked]
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      # No pnpm cache: this privileged publish job must not restore a store that a
      # less-trusted workflow could have poisoned (zizmor cache-poisoning). A
      # release runs rarely, so a clean install is the right trade.
      #
      # No `registry-url`: it makes setup-node write an .npmrc with
      # `_authToken=${NODE_AUTH_TOKEN}`. With no token set that line still sends
      # npm down the legacy-token path (unauthenticated → misleading E404) instead
      # of the OIDC trusted-publishing handshake. Default registry is already
      # registry.npmjs.org, so OIDC engages cleanly with no token configured.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      # npm trusted publishing (OIDC) needs npm >= 11.5.1; provenance is automatic.
      # Pinned (not @latest): this job holds id-token + write tokens, so a
      # compromised npm release must not be able to walk straight into it.
      - run: npm install -g npm@11.16.0
      # Publish with `npm publish` directly (not `changeset publish`): npm has
      # first-class OIDC trusted-publishing support, whereas changeset publish
      # spawns npm in a way that doesn't trigger the OIDC handshake (it failed
      # with ENEEDAUTH — see npm/cli#8976, #9088). The version is already set by
      # the local `changeset version` ritual, so CI only needs to publish.
      # Builds via the package's prepack; authenticates through the OIDC trusted
      # publisher (org Positronick, repo ui, workflow release.yml) — no NPM_TOKEN.
      # `--access public`/`--provenance` are also in publishConfig; passed
      # explicitly to match npm's documented OIDC recipe. Idempotent: skip when
      # this version is already on npm so re-running a tag is a no-op.
      - name: Publish to npm
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version already published; skipping."
          else
            npm publish --access public --provenance
          fi
      # Cut a GitHub Release for the tag. Idempotent: skip if one already exists.
      - name: Create GitHub Release
        # Pass the tag through env, never inline ${{ github.ref_name }} into the
        # shell — that would be a template-injection sink (zizmor).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
          else
            gh release create "$TAG" --verify-tag --generate-notes
          fi
