name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Dev toolchain (commitlint, vite) requires Node >= 22.12; skip git hooks in CI.
env:
  HUSKY: '0'

jobs:
  test:
    name: Lint, check & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright (chromium)
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test:coverage
      - name: Upload coverage to Coveralls
        if: matrix.node == 22
        uses: coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b # v2.3.6
        with:
          file: ./coverage/lcov.info

  package:
    name: Validate package & build Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build package (svelte-package)
        run: pnpm prepack
      - name: Validate package (publint)
        run: pnpm check:package
      - name: Validate published types (attw)
        run: pnpm check:exports
      - name: Check bundle-size budget (size-limit)
        run: pnpm check:size
      - name: Find unused deps/exports/files (knip)
        run: pnpm check:unused
      - name: Build Storybook
        run: pnpm build-storybook

  security:
    name: Supply-chain audit
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      # Audit reads pnpm-lock.yaml directly — no install, so no install scripts run.
      # No --prod: this package has zero runtime dependencies, so the real attack
      # surface is the devDependencies that run in CI and the release job.
      # Diff-based PR gating runs in osv-scanner-pr.yml (OSV + malicious-packages feed).
      - name: Audit dependencies (fails on high/critical)
        run: pnpm audit --audit-level=high
