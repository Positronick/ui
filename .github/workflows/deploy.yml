name: Deploy demo & Storybook

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needs GitHub Pages enabled for the repo (Settings → Pages → Source: GitHub Actions).
# Least privilege: scope Pages/OIDC to the deploy job only.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build demo (prerendered, under the repo subpath)
        run: pnpm exec vite build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      - name: Build Storybook
        run: pnpm build-storybook
      - name: Assemble site (demo at /, Storybook at /storybook)
        run: |
          mkdir -p build/storybook
          cp -r storybook-static/. build/storybook/
          touch build/.nojekyll
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
