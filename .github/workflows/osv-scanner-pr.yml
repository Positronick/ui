name: OSV-Scanner (PR)

# Diff-based supply-chain gate: fails only on vulnerabilities a PR *introduces*
# (so the existing baseline never blocks a feature PR). The full scheduled scan
# lives in osv-scanner.yml.
on:
  pull_request:
    branches: [main]
  merge_group:

permissions: read-all

jobs:
  scan-pr:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
