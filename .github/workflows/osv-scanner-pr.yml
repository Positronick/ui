name: OSV-Scanner (PR)

# Diff-based supply-chain gate: fails only on vulnerabilities a PR *introduces*
# (so the existing baseline never blocks a feature PR). The full scheduled scan
# lives in osv-scanner.yml.
on:
  pull_request:
    branches: [main]
  merge_group:

permissions: read-all

jobs:
  scan-pr:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
